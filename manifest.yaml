# Contract:
#   - `chapters` is in BUILD ORDER: a topological sort of the prerequisite DAG.
#     Generating top-to-bottom guarantees every prerequisite chapter exists
#     before its dependents are written.
#   - `status` is the INITIAL status to stamp into each file's frontmatter,
#     derived from subject volatility: evergreen→stable, mixed/volatile→evolving,
#     frontier topics→experimental. It may drift afterwards; frontmatter is then
#     source of truth and the manifest is updated to match (CI enforces equality).
#   - `build_day` groups chapters into the Day 2–4 generation batches.
#   - IDs are immutable and never reused. Deprecated chapters stay listed with
#     status: deprecated.

