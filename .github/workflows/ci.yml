name: CI

on:
  push:
  pull_request:

jobs:
  validate-metadata:
    name: Validate chapter metadata (METADATA_SCHEMA.md rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run metadata + link validator
        run: python3 scripts/validate.py

  check-content-index:
    name: Check app/data/content.json is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check content index is not stale
        run: python3 scripts/build-content.py --check

      - name: Check explorables still quote their chapters verbatim
        run: python3 scripts/check-explorables.py

      - name: Check labs (reference solutions pass, starters fail, quotes verbatim, labs.json fresh)
        run: python3 scripts/build-labs.py --check

  unit-tests:
    name: Unit tests (mastery model)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run node:test suites
        run: node --test tests/*.test.mjs
