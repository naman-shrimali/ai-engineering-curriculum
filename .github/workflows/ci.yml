name: CI

on:
  push:
  pull_request:

jobs:
  validate-metadata:
    name: Validate chapter metadata (METADATA_SCHEMA.md rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run metadata + link validator
        run: python3 scripts/validate.py

  check-content-index:
    name: Check app/data/content.json is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check content index is not stale
        run: python3 scripts/build-content.py --check
